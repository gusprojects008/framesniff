[project]
name = "framesniff"
version = "1.0.1"
description = "Tool for analyzing communication between devices (Wireless (WiFi or Bluetooth) or Wired (Ethernet)), security testing, exploration of packets and frames of networks and devices."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Gustavo Araújo" }
]

dependencies = [
    "dpkt==1.9.8",
    "textual==6.2.1",
    "rich==14.3.3",
    "argcomplete",
    "cli-core @ git+https://github.com/gusprojects008/cli-core.git@v1.0.0"
]

keywords = [
    "network",
    "sniffer",
    "packets",
    "ethernet",
    "wifi",
    "bluetooth",
    "security"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Networking",
    "Topic :: Security"
]

[project.scripts]
framesniff = "framesniff.cli:main"

[tool.setuptools.packages.find]
include = ["framesniff*"]
